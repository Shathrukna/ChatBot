<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenChat</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>OpenChat</h1>
      <div id="controls">
        <select id="model">
          <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
          <option value="openai/gpt-4o">GPT-4o</option>
          <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
          <option value="google/gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
        </select>
        <button id="settings-btn" title="Assistant settings">Settings</button>
        <button id="reset-btn" title="Start a new chat">New Chat</button>
      </div>
    </header>

    <div id="settings" class="hidden">
      <label for="system-prompt">System prompt (controls the assistant's behavior)</label>
      <textarea id="system-prompt" rows="4" placeholder="You are a helpful, intelligent AI assistant..."></textarea>
    </div>

    <main id="chat" aria-live="polite"></main>

    <form id="chat-form">
      <div id="preview-row" class="hidden">
        <div id="previews"></div>
      </div>
      <div id="input-row">
        <button id="attach-btn" type="button" title="Attach image">Attach</button>
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <input id="chat-input" type="text" placeholder="Message OpenChat..." autocomplete="off" autofocus />
        <button id="send-btn" type="submit">Send</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
